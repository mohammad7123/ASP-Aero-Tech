openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inquiries
    description: Website inquiry submissions
  - name: content
    description: Public website content managed through the admin panel
  - name: products
    description: Published drone product catalog
  - name: storage
    description: Persistent product image storage
  - name: admin
    description: Protected content management operations
  - name: settings
    description: Public-safe and protected site settings
  - name: marketing
    description: Protected campaign drafting, recipient preparation, reports, and AI copy generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /inquiries:
    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit an inquiry
      description: Stores a prospective customer inquiry for the ASP Aertech team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Inquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"
        "400":
          description: Invalid inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /settings:
    get:
      operationId: getPublicSettings
      tags: [settings]
      summary: Get public-safe site settings
      responses:
        "200":
          description: Public settings only; no provider credentials or API keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteSettings" }
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [settings]
      summary: Get editable site settings
      responses:
        "200":
          description: Settings
          content: { application/json: { schema: { $ref: "#/components/schemas/SiteSettings" } } }
        "401": { description: Authentication required }
    put:
      operationId: updateAdminSettings
      tags: [settings]
      summary: Save editable site settings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SiteSettingsInput" } } }
      responses:
        "200":
          description: Saved settings
          content: { application/json: { schema: { $ref: "#/components/schemas/SiteSettings" } } }
        "400": { description: Invalid settings }
        "401": { description: Authentication required }
  /chatbot/messages:
    post:
      operationId: sendChatbotMessage
      tags: [settings]
      summary: Send a message to the configured public website chatbot
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChatbotMessageInput" } } }
      responses:
        "200":
          description: Chatbot reply
          content: { application/json: { schema: { $ref: "#/components/schemas/ChatbotMessageResponse" } } }
        "400": { description: Invalid message }
        "503": { description: Chatbot unavailable }
  /admin/marketing/overview:
    get:
      operationId: getMarketingOverview
      tags: [marketing]
      summary: Get marketing counts
      responses:
        "200": { description: Marketing overview, content: { application/json: { schema: { $ref: "#/components/schemas/MarketingOverview" } } } }
  /admin/campaigns:
    get:
      operationId: listCampaigns
      tags: [marketing]
      summary: List campaigns
      responses:
        "200": { description: Campaigns, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Campaign" } } } } }
    post:
      operationId: createCampaign
      tags: [marketing]
      summary: Create a campaign draft
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignInput" } } } }
      responses:
        "201": { description: Campaign draft, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
  /admin/campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [marketing]
      summary: Get a campaign and prepared recipients
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      responses:
        "200": { description: Campaign, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignDetail" } } } }
    patch:
      operationId: updateCampaign
      tags: [marketing]
      summary: Update a draft or scheduled campaign
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignPatch" } } } }
      responses:
        "200": { description: Updated campaign, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
    delete:
      operationId: deleteCampaign
      tags: [marketing]
      summary: Delete a campaign
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      responses: { "204": { description: Deleted } }
  /admin/campaigns/{id}/prepare:
    post:
      operationId: prepareCampaignRecipients
      tags: [marketing]
      summary: Prepare campaign recipients without sending delivery messages
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      responses:
        "200": { description: Recipients prepared, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignPreparation" } } } }
  /admin/marketing/reports:
    get:
      operationId: getMarketingReports
      tags: [marketing]
      summary: Get supported campaign and usage reports
      responses:
        "200": { description: Reports, content: { application/json: { schema: { $ref: "#/components/schemas/MarketingReports" } } } }
  /admin/ai-studio/generate:
    post:
      operationId: generateMarketingCopy
      tags: [marketing]
      summary: Generate marketing copy through the server-side OpenAI integration
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AiCopyInput" } } } }
      responses:
        "200": { description: Generated copy, content: { application/json: { schema: { $ref: "#/components/schemas/AiCopyResponse" } } } }
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List published drone products
      responses:
        "200":
          description: Published product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a published drone product
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /content/hero-slides:
    get:
      operationId: listHeroSlides
      tags: [content]
      summary: List active homepage hero slides
      responses:
        "200":
          description: Active hero slides in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeroSlide"
  /content/jobs:
    get:
      operationId: listOpenJobs
      tags: [content]
      summary: List active career opportunities
      responses:
        "200":
          description: Active jobs in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
  /content/blog-posts:
    get:
      operationId: listPublishedBlogPosts
      tags: [content]
      summary: List published blog posts
      responses:
        "200":
          description: Published blog posts ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPostSummary"
  /content/blog-posts/{slug}:
    get:
      operationId: getPublishedBlogPost
      tags: [content]
      summary: Get a published blog post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Blog post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Get the current admin session
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/setup:
    post:
      operationId: setupAdmin
      tags: [admin]
      summary: Create the first administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetupInput"
      responses:
        "201":
          description: Administrator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "400":
          description: Invalid administrator details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An administrator already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Sign in to the admin panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Signed in administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "400":
          description: Invalid credentials format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Sign out of the admin panel
      responses:
        "204":
          description: Signed out
  /admin/password/forgot:
    post:
      operationId: requestAdminPasswordReset
      tags: [admin]
      summary: Send a password reset link to an administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminForgotPasswordInput"
      responses:
        "202":
          description: Reset request accepted (the response is identical whether or not the account exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminForgotPasswordResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many reset requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/password/reset:
    get:
      operationId: verifyAdminResetToken
      tags: [admin]
      summary: Check whether a password reset token is still valid
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResetTokenStatus"
    post:
      operationId: resetAdminPassword
      tags: [admin]
      summary: Set a new password using a reset token and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminResetPasswordInput"
      responses:
        "200":
          description: Password updated and administrator signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "400":
          description: Invalid or expired token, or weak password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/password/change:
    post:
      operationId: changeAdminPassword
      tags: [admin]
      summary: Change the signed-in administrator's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChangePasswordInput"
      responses:
        "200":
          description: Password changed; other sessions are signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "400":
          description: Current password is wrong or the new password is too weak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/account:
    patch:
      operationId: updateAdminAccount
      tags: [admin]
      summary: Update the signed-in administrator's recovery email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountInput"
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get admin dashboard metrics
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/resources/{resource}:
    get:
      operationId: listAdminResource
      tags: [admin]
      summary: List records for an admin resource
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Resource records and field metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResourceList"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminResource
      tags: [admin]
      summary: Create a record in an admin resource
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminResourceInput"
      responses:
        "201":
          description: Created resource record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResourceMutationResponse"
        "400":
          description: Invalid resource data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/resources/{resource}/{id}:
    patch:
      operationId: updateAdminResource
      tags: [admin]
      summary: Update a record in an admin resource
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminResourceInput"
      responses:
        "200":
          description: Updated resource record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResourceMutationResponse"
        "400":
          description: Invalid resource data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown resource or record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminResource
      tags: [admin]
      summary: Delete a record from an admin resource
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Record deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown resource or record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned product image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a stored product image
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored object
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Inquiry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        phone:
          type: string
        organization:
          type: ["string", "null"]
        interest:
          type: string
        message:
          type: ["string", "null"]
        marketingConsent:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - phone
        - organization
        - interest
        - message
        - marketingConsent
        - createdAt
    InquiryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        phone:
          type: string
          minLength: 7
        organization:
          type: string
        interest:
          type: string
          minLength: 1
        message:
          type: string
        marketingConsent:
          type: boolean
      required:
        - name
        - email
        - phone
        - interest
        - marketingConsent
    HeroSlide:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        subtitle:
          type: ["string", "null"]
        imageUrl:
          type: string
        eyebrow:
          type: ["string", "null"]
        badge:
          type: ["string", "null"]
        ctaText:
          type: ["string", "null"]
        ctaUrl:
          type: ["string", "null"]
        stat1:
          type: ["string", "null"]
        stat2:
          type: ["string", "null"]
        stat3:
          type: ["string", "null"]
      required: [id, title, subtitle, imageUrl, eyebrow, badge, ctaText, ctaUrl, stat1, stat2, stat3]
    Job:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        department:
          type: string
        location:
          type: string
        type:
          type: string
        description:
          type: string
        requirements:
          type: string
        salaryRange:
          type: ["string", "null"]
      required: [id, title, department, location, type, description, requirements, salaryRange]
    BlogPostSummary:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: ["string", "null"]
        featuredImage:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        publishedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, title, slug, excerpt, featuredImage, category, publishedAt]
    BlogPost:
      allOf:
        - $ref: "#/components/schemas/BlogPostSummary"
        - type: object
          properties:
            content:
              type: string
            metaTitle:
              type: ["string", "null"]
            metaDescription:
              type: ["string", "null"]
          required: [content, metaTitle, metaDescription]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Product:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        image:
          type: ["string", "null"]
        specs:
          type: object
          additionalProperties:
            type: string
        features:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
      required: [id, name, slug, description, image, specs, features, categories]
    UploadUrlRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: number
          minimum: 1
        contentType:
          type: string
          minLength: 1
      required: [name, size, contentType]
    UploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
      required: [uploadURL, objectPath, metadata]
    SiteSettings:
      type: object
      properties:
        siteName: { type: ["string", "null"] }
        tagline: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        siteUrl: { type: ["string", "null"] }
        logoUrl: { type: ["string", "null"] }
        faviconUrl: { type: ["string", "null"] }
        contactEmail: { type: ["string", "null"] }
        contactPhone: { type: ["string", "null"] }
        contactPhone2: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        addresses:
          type: ["array", "null"]
          items: { $ref: "#/components/schemas/ContactAddress" }
        whatsappNumber: { type: ["string", "null"] }
        whatsappGreeting: { type: ["string", "null"] }
        linkedinUrl: { type: ["string", "null"] }
        twitterUrl: { type: ["string", "null"] }
        facebookUrl: { type: ["string", "null"] }
        instagramUrl: { type: ["string", "null"] }
        youtubeUrl: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }
        secondaryColor: { type: ["string", "null"] }
        accentColor: { type: ["string", "null"] }
        theme: { type: ["string", "null"] }
        backgroundColor: { type: ["string", "null"] }
        fontFamily: { type: ["string", "null"] }
        chatbotEnabled: { type: ["boolean", "null"] }
        chatbotName: { type: ["string", "null"] }
        chatbotGreeting: { type: ["string", "null"] }
        chatbotModel: { type: ["string", "null"] }
        smtpHost: { type: ["string", "null"] }
        smtpPort: { type: ["number", "null"] }
        smtpUsername: { type: ["string", "null"] }
        smtpPassword: { type: ["string", "null"] }
        smtpPasswordSet: { type: ["boolean", "null"] }
        smtpFromAddress: { type: ["string", "null"] }
        smsProvider: { type: ["string", "null"] }
