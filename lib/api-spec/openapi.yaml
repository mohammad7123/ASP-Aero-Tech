openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inquiries
    description: Website inquiry submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /inquiries:
    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit an inquiry
      description: Stores a prospective customer inquiry for the ASP Aertech team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Inquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"
        "400":
          description: Invalid inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Inquiry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        organization:
          type: ["string", "null"]
        interest:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - organization
        - interest
        - message
        - createdAt
    InquiryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        organization:
          type: string
          minLength: 2
        interest:
          type: string
          minLength: 2
        message:
          type: string
          minLength: 10
      required:
        - name
        - email
        - interest
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

