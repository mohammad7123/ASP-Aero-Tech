kind = "web"
previewPath = "/"
title = "ASP Aero Tech"
description = "A corporate website for ASP Aero Tech, an Indian drone manufacturer focused on defence, industrial inspection, public safety, and autonomous aerial systems."
version = "1.0.0"
id = "artifacts/aps-aero-tech"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19716

[services.development]
run = "pnpm --filter @workspace/aps-aero-tech run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aps-aero-tech", "run", "build" ]
serve = "static"
publicDir = "artifacts/aps-aero-tech/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19716"
BASE_PATH = "/"